<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사용법 — GTD 워크</title>
<meta name="description" content="GTD 워크 사용법: 시작하기, 담기, 보내기, 하루 쓰기, 돌아보기를 실제 앱 화면으로 하나씩 따라 해요.">
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 우리 앱 스타일: Pretendard · 인디고 바이올렛 · 토스풍 카드 · 앰비언트 라이트 */
:root { --g: #5B5CF6; --g2: #4A4BE0; --gt: #EEEEFF; --t1: #191F28; --t2: #4E5968; --t3: #6B7684; --t4: #A3ACB6; --line: #E9ECEF; --fill: #F2F4F6; --bg: #F4F5F7;
  --l1: #6D6BFF; --l2: #FF7AC6; --l3: #5FD3F3; --amber: #F2A20C; --expo: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--t1); letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid #8B8CFF; outline-offset: 3px; border-radius: 8px; }
.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }

/* 위: 제목 · 챕터 진행 */
.top { display: flex; align-items: center; gap: 20px; padding: 18px clamp(16px, 4vw, 48px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; text-decoration: none; white-space: nowrap; }
.brand i { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #7B6BFF, #E06BD8); display: grid; place-items: center; }
.brand i::after { content: ''; width: 10px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.brand small { color: var(--t3); font-weight: 600; font-size: 14px; }
.chaps { display: flex; gap: 8px; margin-left: auto; list-style: none; padding: 0; }
.chaps li { display: flex; flex-direction: column; gap: 6px; min-width: 72px; font-size: 13px; font-weight: 700; color: var(--t4); }
.chaps li i { height: 5px; border-radius: 3px; background: #E3E6EB; overflow: hidden; }
.chaps li i b { display: block; height: 100%; width: 0; background: var(--g); border-radius: 3px; transition: width .5s var(--expo); }
.chaps li.on { color: var(--g); }
.chaps li.done { color: var(--t2); }

/* 가운데: 폰 + 설명 */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; gap: clamp(24px, 5vw, 80px); padding: 0 clamp(16px, 5vw, 80px); min-height: 0; max-width: 1240px; margin: 0 auto; width: 100%; }
.phone-wrap { position: relative; display: flex; justify-content: center; align-items: center; height: 100%; min-height: 0; padding: 12px 0; }
.amb { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 0deg, var(--l1), var(--l2), var(--l3), #9C8CFF, var(--l1)); filter: blur(70px); opacity: .28; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.phone { position: relative; height: min(76vh, 720px); aspect-ratio: 390 / 844; padding: 4px; border-radius: 36px; background: #0f1015; box-shadow: 0 40px 90px rgba(17, 24, 39, .25), inset 0 0 0 1px #2a2b33; }
.scr { position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: var(--bg); }
.scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: top; opacity: 0; transition: opacity .45s var(--expo); }
.scr img.tall { object-fit: cover; }
.scr img.on { opacity: 1; }
/* 스포트라이트: 볼 곳만 밝게 */
.spot { position: absolute; border-radius: 16px; box-shadow: 0 0 0 2000px rgba(17, 18, 40, .5); outline: 2.5px solid rgba(139, 140, 255, .95); outline-offset: 2px; opacity: 0; transition: left .6s var(--expo), top .6s var(--expo), width .6s var(--expo), height .6s var(--expo), opacity .4s; pointer-events: none; }
.spot.on { opacity: 1; }
/* 누르는 곳: 커서가 움직여 톡 누른다 */
.tap { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(255, 255, 255, .9); box-shadow: 0 6px 18px rgba(17, 18, 40, .35), inset 0 0 0 3px var(--g); opacity: 0; pointer-events: none; transition: left .9s var(--expo), top .9s var(--expo), opacity .3s; }
.tap.on { opacity: 1; animation: press 1.8s ease-in-out .9s infinite; }
.tap::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--g); opacity: 0; animation: ripple 1.8s ease-out .9s infinite; }
@keyframes press { 0%, 35%, 100% { transform: scale(1); } 45% { transform: scale(.78); } 60% { transform: scale(1); } }
@keyframes ripple { 0%, 40% { transform: scale(.6); opacity: 0; } 48% { opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }

.side { min-width: 0; }
.eb { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; background: var(--gt); color: var(--g); font-size: 14px; font-weight: 800; }
.ttl { margin: 16px 0 0; font-size: clamp(30px, 3.6vw, 52px); font-weight: 800; letter-spacing: -0.045em; line-height: 1.12; word-break: keep-all; }
.ttl .w { display: inline-block; white-space: nowrap; }
.ttl .c { display: inline-block; transform: translateY(.5em); opacity: 0; transition: transform .7s var(--expo), opacity .5s; transition-delay: calc(var(--i) * 20ms); }
.ttl.on .c { transform: none; opacity: 1; }
.ttl em { font-style: normal; color: var(--g); }
.desc { margin: 14px 0 0; font-size: clamp(16px, 1.35vw, 19px); color: var(--t2); line-height: 1.6; word-break: keep-all; }
.acts { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 10px; counter-reset: a; }
.acts li { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 2px 10px rgba(17, 24, 39, .05); font-size: 16px; line-height: 1.5; word-break: keep-all; opacity: 0; transform: translateY(12px); transition: opacity .5s var(--expo), transform .6s var(--expo); transition-delay: calc(.25s + var(--i) * .1s); }
.acts li::before { counter-increment: a; content: counter(a); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--g); color: #fff; font-size: 14px; font-weight: 800; display: grid; place-items: center; margin-top: 1px; }
.acts li b { color: var(--t1); }
.acts.on li { opacity: 1; transform: none; }
.tip { margin: 14px 0 0; padding: 12px 16px; border-radius: 14px; background: #FFF8E6; color: #8A5A00; font-size: 14.5px; line-height: 1.55; word-break: keep-all; }
.tip:empty { display: none; }
/* 해 봤어요 확인 */
.did { display: inline-flex; align-items: center; gap: 12px; margin-top: 20px; padding: 12px 18px 12px 12px; border-radius: 16px; border: 1.5px dashed #C9CBFF; color: var(--g); font-weight: 800; font-size: 15px; transition: background .3s, border-color .3s; }
.did i { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--g); display: grid; place-items: center; background: #fff; transition: background .3s; }
.did svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .4s var(--expo) .05s; }
.did.on { background: var(--gt); border-style: solid; }
.did.on i { background: var(--g); }
.did.on svg { stroke-dashoffset: 0; }

/* 표지·마무리 */
.cover { text-align: left; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
.ccard { display: flex; gap: 14px; align-items: center; padding: 18px; border-radius: 20px; background: #fff; box-shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 2px 10px rgba(17, 24, 39, .05); text-align: left; opacity: 0; transform: translateY(14px) scale(.97); transition: opacity .5s var(--expo), transform .7s var(--spring); transition-delay: calc(.2s + var(--i) * .08s); }
.on .ccard { opacity: 1; transform: none; }
.ccard b { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--gt); color: var(--g); font-size: 16px; display: grid; place-items: center; }
.ccard span { font-weight: 800; font-size: 17px; } .ccard small { display: block; color: var(--t3); font-weight: 600; font-size: 13.5px; margin-top: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 16px; font-weight: 800; font-size: 16px; text-decoration: none; transition: transform .2s var(--spring), box-shadow .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.pri { background: var(--g); color: #fff; box-shadow: 0 12px 30px rgba(91, 92, 246, .35); }
.btn.talk { background: #FEE500; color: #191919; }
.btn.sub { background: #fff; color: var(--t1); box-shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 2px 10px rgba(17, 24, 39, .06); }

/* 아래: 이동 */
.bottom { display: flex; align-items: center; gap: 12px; padding: 14px clamp(16px, 4vw, 48px) 20px; }
.nav { min-height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 800; font-size: 15px; }
.prev { background: #fff; box-shadow: 0 1px 2px rgba(17, 24, 39, .06); color: var(--t2); }
.next { background: var(--g); color: #fff; box-shadow: 0 10px 26px rgba(91, 92, 246, .3); margin-left: 12px; }
.nav:disabled { opacity: .35; cursor: default; }
.count { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--t3); font-variant-numeric: tabular-nums; }
.keys { font-size: 13px; color: var(--t4); font-weight: 600; }

@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  body { overflow: auto; }
  .app { position: static; min-height: 100svh; }
  .top { flex-wrap: wrap; gap: 10px; padding-bottom: 6px; }
  .chaps { margin-left: 0; width: 100%; } .chaps li { flex: 1; min-width: 0; font-size: 12px; }
  .main { grid-template-columns: 1fr; gap: 12px; padding-bottom: 8px; }
  .phone { height: min(52svh, 480px); border-radius: 28px; padding: 3px; } .scr { border-radius: 25px; }
  .side { text-align: left; }
  .ttl { font-size: 28px; margin-top: 10px; }
  .acts { margin-top: 16px; } .acts li { font-size: 15px; padding: 12px 14px; }
  .bottom { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); }
  .keys { display: none; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="../"><i aria-hidden="true"></i>GTD 워크 <small>사용법</small></a>
    <ol class="chaps" aria-label="챕터"></ol>
  </header>

  <main class="main">
    <div class="phone-wrap" aria-hidden="true">
      <div class="amb"></div>
      <div class="phone"><div class="scr" id="scr"><i class="spot" id="spot"></i><i class="tap" id="tap"></i></div></div>
    </div>
    <section class="side" id="side" aria-live="polite"></section>
  </main>

  <footer class="bottom">
    <button class="nav prev" id="prev" type="button">← 이전</button>
    <button class="nav next" id="next" type="button">다음 →</button>
    <span class="keys">키보드 ← → 로도 넘겨요</span>
    <span class="count" id="count"></span>
  </footer>
</div>
