<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사용법 — GTD 워크</title>
<meta name="description" content="GTD 워크 사용법: 담기, 보내기, 하루 쓰기, 돌아보기를 실제 앱 화면 위에서 직접 움직이며 보여 드려요.">
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 앱과 같은 토큰: Pretendard · 인디고 바이올렛 · 토스풍. 휴대폰 안은 실제 앱 화면(guide/s/*.html, 앱 CSS 그대로) */
:root { --g: #5B5CF6; --gt: #EEEEFF; --t1: #191F28; --t2: #4E5968; --t3: #6B7684; --t4: #A3ACB6; --bg: #F4F5F7;
  --b1: #6D6BFF; --b2: #FF7AC6; --b3: #5FD3F3;
  --expo: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); --soft: cubic-bezier(.65, 0, .35, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--t1); letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid #8B8CFF; outline-offset: 3px; border-radius: 8px; }
.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* 위: 브랜드 · 챕터 */
.top { display: flex; align-items: center; gap: 20px; padding: 18px clamp(16px, 4vw, 48px); position: relative; z-index: 2; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; text-decoration: none; white-space: nowrap; }
.brand i { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #7B6BFF, #E06BD8); display: grid; place-items: center; }
.brand i::after { content: ''; width: 10px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.brand small { color: var(--t3); font-weight: 600; font-size: 14px; }
.chaps { display: flex; gap: 6px; margin: 0 0 0 auto; list-style: none; padding: 0; }
.chaps button { display: flex; flex-direction: column; gap: 7px; min-width: 76px; padding: 4px 2px; font-size: 13px; font-weight: 700; color: var(--t4); text-align: left; width: 100%; transition: color .3s; }
.chaps i { height: 4px; border-radius: 2px; background: #E3E6EB; overflow: hidden; }
.chaps i b { display: block; height: 100%; width: 0; background: var(--g); border-radius: 2px; transition: width .7s var(--expo); }
.chaps .on { color: var(--g); } .chaps .done { color: var(--t2); }

/* 가운데: 휴대폰(실제 앱) + 큰 한마디 */
.main { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); align-items: center; gap: clamp(24px, 5vw, 88px); padding: 0 clamp(16px, 5vw, 80px); min-height: 0; max-width: 1280px; margin: 0 auto; width: 100%; }
.stagebox { position: relative; display: flex; justify-content: center; align-items: center; height: 100%; min-height: 0; padding: 10px 0; }
/* 모핑: 휴대폰 뒤 빛 덩어리가 모양·색을 바꾼다(챕터마다 색) */
.blob { position: absolute; width: 74%; aspect-ratio: 1; background: radial-gradient(circle at 30% 30%, var(--b1), transparent 60%), radial-gradient(circle at 70% 40%, var(--b2), transparent 58%), radial-gradient(circle at 50% 75%, var(--b3), transparent 60%);
  filter: blur(54px); opacity: .42; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; animation: morph 9s var(--soft) infinite alternate; transition: --b1 1.2s, --b2 1.2s, --b3 1.2s; }
@property --b1 { syntax: '<color>'; inherits: true; initial-value: #6D6BFF; }
@property --b2 { syntax: '<color>'; inherits: true; initial-value: #FF7AC6; }
@property --b3 { syntax: '<color>'; inherits: true; initial-value: #5FD3F3; }
@keyframes morph {
  0% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: rotate(0) scale(1); }
  33% { border-radius: 63% 37% 45% 55% / 55% 62% 38% 45%; transform: rotate(40deg) scale(1.06); }
  66% { border-radius: 38% 62% 33% 67% / 62% 35% 65% 38%; transform: rotate(-20deg) scale(.96); }
  100% { border-radius: 55% 45% 58% 42% / 38% 58% 42% 62%; transform: rotate(15deg) scale(1.03); } }
.phone { position: relative; height: min(78vh, 760px); aspect-ratio: 390 / 844; padding: 5px; border-radius: 44px; background: #0f1015; box-shadow: 0 50px 100px rgba(17, 24, 39, .28), inset 0 0 0 1px #2a2b33; transition: transform .9s var(--spring); }
.phone.enter { animation: enter 1.1s var(--spring) both; }
@keyframes enter { from { transform: translateY(40px) scale(.9) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
.scr { position: relative; width: 100%; height: 100%; border-radius: 39px; overflow: hidden; background: #F2F4F6; isolation: isolate; }
/* 카메라: 볼 곳으로 확대(scale) */
.cam { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform 1s var(--expo); will-change: transform; }
.cam iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; opacity: 0; transition: opacity .35s ease; pointer-events: none; background: #F2F4F6; }
.cam iframe.on { opacity: 1; }
.ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 4; }
.ink path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ink .trail { stroke: rgba(91, 92, 246, .55); stroke-width: 3; stroke-dasharray: 2 7; }
.ink .tick { stroke: #fff; stroke-width: 5; }
.ink .tickbg { fill: var(--g); }
.flylayer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.flyc { position: absolute; display: flex; align-items: center; padding: 0 14px; border-radius: 14px; background: #fff; color: var(--t1); font-weight: 700; white-space: nowrap; overflow: hidden; box-shadow: 0 18px 40px rgba(40, 42, 120, .28), 0 0 0 2px rgba(91, 92, 246, .55); }
/* 손가락: 곡선(motion path)으로 움직여 누른다 */
.finger { position: absolute; left: -60px; top: -60px; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .55); box-shadow: 0 8px 22px rgba(17, 18, 40, .28), inset 0 0 0 2.5px rgba(91, 92, 246, .9); backdrop-filter: blur(2px); z-index: 5; opacity: 0; pointer-events: none; transition: opacity .3s, transform .14s; }
.finger.on { opacity: 1; }
.finger.down { transform: scale(.76); }
.finger::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid rgba(91, 92, 246, .8); opacity: 0; }
.finger.ping::after { animation: ping .7s ease-out; }
@keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

.side { position: relative; min-width: 0; }
.eb { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: var(--g); }
.eb b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--gt); font-size: 13px; font-variant-numeric: tabular-nums; }
.kw { position: relative; margin: 18px 0 0; font-size: clamp(46px, 6.2vw, 96px); font-weight: 800; letter-spacing: -0.055em; line-height: 1.06; word-break: keep-all; }
.kw .w { display: inline-block; white-space: nowrap; }
.kw .c { display: inline-block; transform: translateY(.55em) scale(.7) rotate(6deg); opacity: 0; filter: blur(8px); transition: transform .9s var(--spring), opacity .45s, filter .6s; transition-delay: calc(var(--i) * 32ms); }
.kw.on .c { transform: none; opacity: 1; filter: none; }
.kw.leave .c { transform: translateY(-.4em) scale(1.15); opacity: 0; filter: blur(10px); transition: transform .35s ease-in, opacity .3s, filter .3s; transition-delay: calc(var(--i) * 12ms); }
.kw .c.e { background: linear-gradient(100deg, #5B5CF6, #A35BF6 70%, #E06BD8); -webkit-background-clip: text; background-clip: text; color: transparent; }
/* 강조 단어 밑줄을 손으로 긋듯(line drawing) */
.kw svg.ul { position: absolute; pointer-events: none; overflow: visible; }
.kw svg.ul path { fill: none; stroke: url(#ulg); stroke-width: 7; stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .9s var(--expo) forwards; animation-delay: .65s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.sub { margin: 22px 0 0; max-width: 30em; font-size: clamp(17px, 1.45vw, 21px); color: var(--t2); line-height: 1.55; word-break: keep-all; opacity: 0; transform: translateY(14px); transition: opacity .6s var(--expo) .4s, transform .8s var(--expo) .4s; }
.sub b { color: var(--t1); font-variant-numeric: tabular-nums; }
.side.on .sub { opacity: 1; transform: none; }
.side.leave .sub, .side.leave .flow, .side.leave .links, .side.leave .eb { opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .3s; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 26px 0 0; padding: 0; list-style: none; }
.flow li { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(16px, 1.4vw, 20px); font-weight: 800; color: var(--t3); opacity: 0; transform: translateY(12px) scale(.9); transition: opacity .5s, transform .7s var(--spring), color .3s; transition-delay: calc(.5s + var(--i) * .12s); }
.flow li span { padding: 10px 16px; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 4px 14px rgba(17, 24, 39, .06); transition: background .35s, color .35s, box-shadow .35s, transform .45s var(--spring); }
.flow li + li::before { content: '→'; color: var(--t4); font-weight: 700; }
.flow li.now span { background: var(--g); color: #fff; box-shadow: 0 10px 26px rgba(91, 92, 246, .35); transform: scale(1.08); }
.side.on .flow li { opacity: 1; transform: none; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; opacity: 0; transform: translateY(10px); transition: opacity .6s .55s, transform .7s var(--spring) .55s; }
.side.on .links { opacity: 1; transform: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 24px; border-radius: 16px; font-weight: 800; font-size: 16.5px; text-decoration: none; transition: transform .25s var(--spring), box-shadow .2s; }
.btn:hover { transform: translateY(-2px) scale(1.03); }
.btn:active { transform: scale(.96); }
.btn.pri { background: var(--g); color: #fff; box-shadow: 0 14px 32px rgba(91, 92, 246, .35); }
.btn.talk { background: #FEE500; color: #191919; }
.btn.sub2 { background: #fff; color: var(--t1); box-shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 2px 10px rgba(17, 24, 39, .06); }

/* 아래: 이동 */
.bottom { display: flex; align-items: center; gap: 12px; padding: 14px clamp(16px, 4vw, 48px) 20px; position: relative; z-index: 2; }
.nav { min-height: 50px; padding: 0 22px; border-radius: 15px; font-weight: 800; font-size: 15.5px; transition: transform .25s var(--spring); }
.nav:active { transform: scale(.94); }
.prev { background: #fff; box-shadow: 0 1px 2px rgba(17, 24, 39, .06); color: var(--t2); }
.next { background: var(--t1); color: #fff; }
.nav:disabled { opacity: .3; cursor: default; }
.replay { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--t3); }
.replay:hover { background: #fff; }
.count { font-size: 14px; font-weight: 700; color: var(--t4); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  body { overflow: auto; }
  .app { position: static; min-height: 100svh; }
  .top { flex-wrap: wrap; gap: 10px; padding: 14px 16px 4px; }
  .chaps { margin: 0; width: 100%; } .chaps li { flex: 1; min-width: 0; } .chaps button { min-width: 0; font-size: 12px; }
  .main { grid-template-columns: 1fr; gap: 6px; padding: 0 16px 96px; }
  .stagebox { padding: 6px 0 0; }
  .phone { height: min(48svh, 460px); border-radius: 32px; padding: 4px; } .scr { border-radius: 28px; }
  .side { text-align: center; padding: 6px 0 0; }
  .kw { font-size: clamp(36px, 10.5vw, 52px); margin-top: 8px; }
  .sub { margin: 12px auto 0; font-size: 16px; }
  .flow { justify-content: center; margin-top: 16px; gap: 6px; }
  .flow li { font-size: 14.5px; gap: 6px; } .flow li span { padding: 8px 11px; }
  .links { justify-content: center; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(244, 245, 247, 0), var(--bg) 35%); }
  .replay span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .blob { animation: none; }
  .kw .c, .sub, .flow li, .phone.enter { transition: none; animation: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ulg" x1="0" x2="1"><stop offset="0" stop-color="#5B5CF6"/><stop offset=".7" stop-color="#A35BF6"/><stop offset="1" stop-color="#E06BD8"/></linearGradient></defs></svg>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <a class="brand" href="../"><i aria-hidden="true"></i>GTD 워크 <small>사용법</small></a>
    <ol class="chaps" id="chaps" aria-label="챕터"></ol>
  </header>

  <main class="main">
    <div class="stagebox" aria-hidden="true">
      <div class="blob" id="blob"></div>
      <div class="phone enter" id="phone"><div class="scr" id="scr"><div class="cam" id="cam">
        <iframe id="fa" title="앱 화면" tabindex="-1"></iframe><iframe id="fb" title="앱 화면" tabindex="-1"></iframe>
        <svg class="ink" id="ink"></svg><div class="flylayer" id="fly"></div><i class="finger" id="finger"></i>
      </div></div></div>
    </div>
    <section class="side" id="side" aria-live="polite"></section>
  </main>

  <footer class="bottom">
    <button class="nav prev" id="prev" type="button">← 이전</button>
    <button class="nav next" id="next" type="button">다음 →</button>
    <button class="replay" id="replay" type="button" aria-label="이 장면 다시 보기">↻ <span>다시 보기</span></button>
    <span class="count" id="count"></span>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var APP = '../app/', TALK = 'https://open.kakao.com/o/gmiCVeWi';
  var CH = ['시작', '담기', '보내기', '하루 쓰기', '돌아보기'];
  // 챕터마다 빛 덩어리 색(모핑)
  var HUE = [['#6D6BFF', '#FF7AC6', '#5FD3F3'], ['#5B8CFF', '#5FD3F3', '#9C8CFF'], ['#FF7AC6', '#A35BF6', '#FFB86B'], ['#FFB020', '#FF7AC6', '#6D6BFF'], ['#3CC6A0', '#5FD3F3', '#6D6BFF'], ['#A35BF6', '#FF7AC6', '#FFB020']];
  var NEXT = '세무사님께 부가세 자료 일정 전화로 확인', NEXT2 = '분기 보고서 초안 목차 쓰기';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 장면: 휴대폰 안은 실제 앱 화면(guide/s/*.html — GTD 레포 tools/guide-scenes.js로 생성). play = 그 위에서 재생할 동작.
  // kw = 크게 보일 한마디([ ]는 강조), sub = 한 줄 설명(<b data-count="N">는 숫자가 올라감), flow = 순서가 있으면 큰 단어 칩
  var S = [
    { ch: -1, scene: 'home', eb: '사용법', kw: '머릿속은 [비우고], 오늘은 가볍게.', sub: '실제 앱 화면 위에서 하나씩 보여 드릴게요. <b data-count="3">3</b>분이면 다 봐요.',
      play: function (a) { return a.countHero(0, 7).then(function () { return a.zoom('#capInput', 1.25); }).then(function () { return a.type('#capInput', '내일 회의 자료 뽑기'); }).then(function () { return a.wait(900); }).then(function () { a.clear('#capInput'); return a.unzoom(); }); } },
    { ch: 0, scene: 'home', eb: '시작', kw: '링크 하나로 [시작].', sub: '메일의 <b>시작하기</b>를 누르고 구글 계정을 고르면 끝. 내 드라이브에 내 시트가 생겨요.',
      flow: ['구글 계정 고르기', '고급 ▸ 이동', '모두 선택 ▸ 계속'],
      play: function (a) { return a.flowStep(0, 1100).then(function () { return a.flowStep(1, 1100); }).then(function () { return a.flowStep(2, 1100); }).then(function () { a.flowStep(-1, 0); return a.countHero(0, 7); }).then(function () { return a.ring(0, 0.0); }); } },
    { ch: 1, scene: 'home', eb: '담기', kw: '떠오르면, [한 줄].', sub: '맨 위 입력칸에 적고 <b>엔터</b>. 오늘 할 일에 바로 들어가요.',
      play: function (a) {
        var from;
        return a.zoom('#capInput', 1.3).then(function () { return a.tap('#capInput'); }).then(function () { return a.type('#capInput', '은행 서류 떼기'); })
          .then(function () { return a.tap('#capBtn'); }).then(function () { from = a.rect('#capInput'); a.clear('#capInput'); return a.unzoom(); })
          .then(function () { return a.show('capture-added'); })
          .then(function () { return a.flyTo(from, a.row('은행 서류 떼기'), '은행 서류 떼기'); })
          .then(function () { a.burst(a.row('은행 서류 떼기'), 40); return a.countHero(7, 8); });
      } },
    { ch: 2, scene: 'home', eb: '보내기', kw: '누르면, [어디로?]', sub: '할 일을 누르면 보낼 곳이 한 번에 나와요. 날짜, 맡기기, 나중에.',
      play: function (a) {
        var from;
        return a.tap(a.row(NEXT)).then(function () { from = a.rect(a.row(NEXT)); return a.show('send', { sheet: true, hide: '#tTitle' }); })
          .then(function () { return a.flyTo(from, '#tTitle', NEXT, true); })
          .then(function () { return a.zoom('#sheetBody [data-a="s-day"]', 1.2); })
          .then(function () { return a.pulse('#sheetBody [data-a="s-day"] .tile, #sheetBody [data-a="s-who"] .tile, #sheetBody [data-a="s-later"] .tile'); })
          .then(function () { return a.unzoom(); });
      } },
    { ch: 2, scene: 'send', eb: '보내기', kw: '날짜는 [한 번에].', sub: '<b>날짜</b>를 누르면 오늘·내일·이번 주가 버튼으로 나와요.',
      play: function (a) {
        return a.tap('#sheetBody [data-a="s-day"]').then(function () { return a.show('send-day'); })
          .then(function () { return a.zoom('#sheetBody [data-sday]:nth-child(2)', 1.35); })
          .then(function () { return a.tap('#sheetBody [data-sday]:nth-child(2)'); }).then(function () { return a.unzoom(); });
      } },
    { ch: 2, scene: 'send', eb: '보내기', kw: '맡기고, [잊기].', sub: '누구에게 맡겼는지 적어 두면, 확인할 날에 다시 올라와요.',
      play: function (a) {
        return a.tap('#sheetBody [data-a="s-who"]').then(function () { return a.show('send-who'); })
          .then(function () { return a.zoom('#sWhoIn', 1.3); }).then(function () { return a.tap('#sWhoIn'); })
          .then(function () { return a.type('#sWhoIn', '박주임'); }).then(function () { return a.tap('#sWhoOk'); }).then(function () { return a.unzoom(); });
      } },
    { ch: 3, scene: 'home', eb: '하루 쓰기', kw: '★ 중요한 건 [위로].', sub: '중요한 일에 <b>★</b>. 맨 위로 올라와요. 하루 <b data-count="3">3</b>개면 충분해요.',
      play: function (a) {
        var from;
        return a.tap(a.row(NEXT2)).then(function () { from = a.rect(a.row(NEXT2)); return a.show('star-sheet', { sheet: true }); })
          .then(function () { return a.tap('#sheetBody [data-a="star"]'); }).then(function () { return a.show('star-done'); })
          .then(function () { return a.flyTo(from, a.row(NEXT2), '★ ' + NEXT2); })

      if (ch === ' ' && !em) { if (w.length) words.push(w); w = []; continue; }
      w.push({ c: ch === ' ' ? ' ' : ch, e: em });
    }
    if (w.length) words.push(w);
    return words.map(function (wd) {
      return '<span class="w">' + wd.map(function (o) { return '<span class="c' + (o.e ? ' e' : '') + '" style="--i:' + (n++) + '">' + o.c + '</span>'; }).join('') + '</span>';
    }).join(' ');
  }
  // 강조 글자 밑에 손으로 긋는 밑줄
  function underline(kw) {
    // 글자는 등장 애니메이션 중이라 화면 좌표 대신 배치 좌표(offset)로 잰다. 줄이 바뀌면 마지막 줄만
    var es = [].slice.call(kw.querySelectorAll('.c.e')); if (!es.length) return;
    var last = es[es.length - 1], line = es.filter(function (e) { return Math.abs(e.offsetTop - last.offsetTop) < 4; });
    var a = line[0], x0 = a.offsetLeft + (a.offsetParent !== kw ? a.offsetParent.offsetLeft : 0), x1 = last.offsetLeft + last.offsetWidth + (last.offsetParent !== kw ? last.offsetParent.offsetLeft : 0);
    var y = last.offsetTop + (last.offsetParent !== kw ? last.offsetParent.offsetTop : 0) + last.offsetHeight * .92, w = x1 - x0;
    var svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('class', 'ul');
    svg.style.left = '0'; svg.style.top = '0'; svg.setAttribute('width', kw.offsetWidth); svg.setAttribute('height', kw.offsetHeight + 24);
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', 'M' + x0 + ' ' + (y + 2) + ' C' + (x0 + w * .3) + ' ' + (y - 5) + ' ' + (x0 + w * .65) + ' ' + (y + 7) + ' ' + x1 + ' ' + (y - 1));
    svg.appendChild(p); kw.appendChild(svg);
    p.style.setProperty('--len', p.getTotalLength() + 1);
  }
  var painted = false;
  function paintSide(s) {
    var render = function () {
      var h = '<div class="eb">' + (s.ch >= 0 && !s.end ? '<b>' + (s.ch + 1) + '</b>' : '') + s.eb + '</div>' +
        '<h1 class="kw" aria-label="' + s.kw.replace(/[\[\]]/g, '') + '">' + kwHtml(s.kw) + '</h1><p class="sub">' + s.sub + '</p>';
      if (s.flow) h += '<ol class="flow">' + s.flow.map(function (f, i) { return '<li style="--i:' + i + '"><span>' + f + '</span></li>'; }).join('') + '</ol>';
      if (s.ch === -1) h += '<div class="links"><button class="btn pri" type="button" id="startBtn">시작하기 →</button></div>';
      if (s.end) h += '<div class="links"><a class="btn pri" href="' + APP + '">GTD 워크 열기</a><a class="btn talk" href="' + TALK + '" target="_blank" rel="noopener">💬 카톡방</a><button class="btn sub2" type="button" id="againBtn">처음부터 다시</button></div>';
      side.className = 'side'; side.innerHTML = h;
      var kw = side.querySelector('.kw');
      requestAnimationFrame(function () { requestAnimationFrame(function () { side.classList.add('on'); kw.classList.add('on'); underline(kw); countSide(); }); });
      var sb = $('startBtn'); if (sb) sb.addEventListener('click', function () { go(1); });
      var ab = $('againBtn'); if (ab) ab.addEventListener('click', function () { go(0); });
    };
    // 바뀔 때: 지금 글자가 흩어지며 사라지고(morph out) 새 글자가 튀어 오름
    var old = side.querySelector('.kw');
    if (painted && old && !reduce) { old.classList.remove('on'); old.classList.add('leave'); side.classList.add('leave'); setTimeout(render, 280); }
    else render();
    painted = true;
  }

  // ── 재생: 처음 모습 → 동작 → 잠깐 쉬고 반복 ──
  function reset() {
    fin.classList.remove('on', 'down', 'ping'); fx = fy = -60; fin.style.left = fin.style.top = '-60px';
    cam.style.transform = ''; zoomed = false; ink.innerHTML = ''; fly.innerHTML = '';
  }
  function run() {
    var s = S[cur], my = ++token;
    reset();
    frames[1 - front].dataset.fresh = '0';
    return show(s.scene).then(function () {
      if (!s.play || my !== token) return;
      return wait(450).then(function () { return s.play(A); }).then(function () { fin.classList.remove('on'); return wait(2800); })
        .then(function () { if (my === token && !reduce && !s.end) run(); });
    }).catch(function () {});
  }
  function go(i) {
    cur = Math.max(0, Math.min(S.length - 1, i));
    $('prev').disabled = cur === 0; $('next').disabled = cur === S.length - 1;
    $('count').textContent = (cur + 1) + ' / ' + S.length;
    paintSide(S[cur]); paintChaps(); run();
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }
  $('prev').addEventListener('click', function () { go(cur - 1); });
  $('next').addEventListener('click', function () { go(cur + 1); });
  $('replay').addEventListener('click', function () { run(); });
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  });
  var sx = null; // 휴대폰: 글 쪽을 옆으로 밀어 넘기기
  side.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  side.addEventListener('touchend', function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); sx = null; });
  addEventListener('hashchange', function () { var n = parseInt((location.hash || '').slice(1), 10); if (n > 0 && n - 1 !== cur) go(n - 1); });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(start > 0 ? start - 1 : 0);
})();
</script>
