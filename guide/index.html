<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사용법 — GTD 워크</title>
<meta name="description" content="GTD 워크 사용법: 담기, 보내기, 하루 쓰기, 돌아보기를 실제 앱 화면 위에서 직접 움직이며 보여 드려요.">
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 앱과 같은 토큰: Pretendard · 인디고 바이올렛 · 토스풍. 휴대폰 안은 실제 앱 화면(guide/s/*.html, 앱 CSS 그대로) */
:root { --g: #5B5CF6; --gt: #EEEEFF; --t1: #191F28; --t2: #4E5968; --t3: #6B7684; --t4: #A3ACB6; --bg: #F4F5F7;
  --l1: #6D6BFF; --l2: #FF7AC6; --l3: #5FD3F3; --expo: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--t1); letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 3px solid #8B8CFF; outline-offset: 3px; border-radius: 8px; }
.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }

/* 위: 브랜드 · 챕터 */
.top { display: flex; align-items: center; gap: 20px; padding: 18px clamp(16px, 4vw, 48px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; text-decoration: none; white-space: nowrap; }
.brand i { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #7B6BFF, #E06BD8); display: grid; place-items: center; }
.brand i::after { content: ''; width: 10px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.brand small { color: var(--t3); font-weight: 600; font-size: 14px; }
.chaps { display: flex; gap: 6px; margin: 0 0 0 auto; list-style: none; padding: 0; }
.chaps button { display: flex; flex-direction: column; gap: 7px; min-width: 76px; padding: 4px 2px; font-size: 13px; font-weight: 700; color: var(--t4); text-align: left; width: 100%; }
.chaps i { height: 4px; border-radius: 2px; background: #E3E6EB; overflow: hidden; }
.chaps i b { display: block; height: 100%; width: 0; background: var(--g); border-radius: 2px; transition: width .5s var(--expo); }
.chaps .on { color: var(--g); } .chaps .done { color: var(--t2); }

/* 가운데: 휴대폰(실제 앱) + 큰 한마디 */
.main { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); align-items: center; gap: clamp(24px, 5vw, 88px); padding: 0 clamp(16px, 5vw, 80px); min-height: 0; max-width: 1280px; margin: 0 auto; width: 100%; }
.stagebox { position: relative; display: flex; justify-content: center; align-items: center; height: 100%; min-height: 0; padding: 10px 0; }
.amb { position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from 0deg, var(--l1), var(--l2), var(--l3), #9C8CFF, var(--l1)); filter: blur(80px); opacity: .26; animation: spin 16s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.phone { position: relative; height: min(78vh, 760px); aspect-ratio: 390 / 844; padding: 5px; border-radius: 44px; background: #0f1015; box-shadow: 0 50px 100px rgba(17, 24, 39, .28), inset 0 0 0 1px #2a2b33; }
.scr { position: relative; width: 100%; height: 100%; border-radius: 39px; overflow: hidden; background: #F2F4F6; isolation: isolate; }
.scr iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; opacity: 0; transition: opacity .35s ease; pointer-events: none; background: #F2F4F6; }
.scr iframe.on { opacity: 1; }
/* 손가락: 실제로 누르는 것처럼 */
.finger { position: absolute; left: 50%; top: 110%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .55); box-shadow: 0 8px 22px rgba(17, 18, 40, .28), inset 0 0 0 2.5px rgba(91, 92, 246, .9); backdrop-filter: blur(2px); z-index: 5; opacity: 0; pointer-events: none; transition: left .7s var(--expo), top .7s var(--expo), opacity .3s, transform .14s; }
.finger.on { opacity: 1; }
.finger.down { transform: scale(.78); }
.finger::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid rgba(91, 92, 246, .8); opacity: 0; }
.finger.ping::after { animation: ping .7s ease-out; }
.finger.drag { transition: left .05s linear, top .05s linear, opacity .3s, transform .14s; }
@keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2); opacity: 0; } }

.side { min-width: 0; }
.eb { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: var(--g); }
.eb b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--gt); font-size: 13px; }
.kw { margin: 18px 0 0; font-size: clamp(46px, 6.2vw, 96px); font-weight: 800; letter-spacing: -0.055em; line-height: 1.06; word-break: keep-all; }
.kw .w { display: inline-block; white-space: nowrap; }
.kw .c { display: inline-block; transform: translateY(.45em); opacity: 0; filter: blur(6px); transition: transform .8s var(--expo), opacity .5s, filter .6s; transition-delay: calc(var(--i) * 28ms); }
.kw.on .c { transform: none; opacity: 1; filter: none; }
.kw .c.e { background: linear-gradient(100deg, #5B5CF6, #A35BF6 70%, #E06BD8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 22px 0 0; max-width: 30em; font-size: clamp(17px, 1.45vw, 21px); color: var(--t2); line-height: 1.55; word-break: keep-all; opacity: 0; transform: translateY(10px); transition: opacity .6s var(--expo) .35s, transform .7s var(--expo) .35s; }
.sub b { color: var(--t1); }
.side.on .sub { opacity: 1; transform: none; }
/* 순서가 있는 동작은 큰 단어 칩으로 */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 26px 0 0; padding: 0; list-style: none; }
.flow li { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(16px, 1.4vw, 20px); font-weight: 800; color: var(--t3); opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .6s var(--expo), color .3s; transition-delay: calc(.45s + var(--i) * .12s); }
.flow li span { padding: 10px 16px; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 4px 14px rgba(17, 24, 39, .06); transition: background .3s, color .3s, box-shadow .3s; }
.flow li + li::before { content: '→'; color: var(--t4); font-weight: 700; }
.flow li.now span { background: var(--g); color: #fff; box-shadow: 0 10px 26px rgba(91, 92, 246, .35); }
.side.on .flow li { opacity: 1; transform: none; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; opacity: 0; transition: opacity .6s .5s; }
.side.on .links { opacity: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 24px; border-radius: 16px; font-weight: 800; font-size: 16.5px; text-decoration: none; transition: transform .2s var(--spring), box-shadow .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.pri { background: var(--g); color: #fff; box-shadow: 0 14px 32px rgba(91, 92, 246, .35); }
.btn.talk { background: #FEE500; color: #191919; }
.btn.sub2 { background: #fff; color: var(--t1); box-shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 2px 10px rgba(17, 24, 39, .06); }

/* 아래: 이동 */
.bottom { display: flex; align-items: center; gap: 12px; padding: 14px clamp(16px, 4vw, 48px) 20px; }
.nav { min-height: 50px; padding: 0 22px; border-radius: 15px; font-weight: 800; font-size: 15.5px; }
.prev { background: #fff; box-shadow: 0 1px 2px rgba(17, 24, 39, .06); color: var(--t2); }
.next { background: var(--t1); color: #fff; }
.nav:disabled { opacity: .3; cursor: default; }
.replay { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--t3); }
.replay:hover { background: #fff; }
.count { font-size: 14px; font-weight: 700; color: var(--t4); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  body { overflow: auto; }
  .app { position: static; min-height: 100svh; }
  .top { flex-wrap: wrap; gap: 10px; padding: 14px 16px 4px; }
  .chaps { margin: 0; width: 100%; } .chaps li { flex: 1; min-width: 0; } .chaps button { min-width: 0; font-size: 12px; }
  .main { grid-template-columns: 1fr; gap: 6px; padding: 0 16px 6px; }
  .stagebox { padding: 6px 0 0; }
  .phone { height: min(48svh, 460px); border-radius: 32px; padding: 4px; } .scr { border-radius: 28px; }
  .main { padding-bottom: 96px; }
  .side { text-align: center; padding: 6px 0 0; }
  .kw { font-size: clamp(36px, 10.5vw, 52px); margin-top: 8px; }
  .sub { margin: 12px auto 0; font-size: 16px; }
  .flow { justify-content: center; margin-top: 16px; gap: 6px; }
  .flow li { font-size: 14.5px; gap: 6px; } .flow li span { padding: 8px 11px; }
  .links { justify-content: center; }
  .bottom { position: sticky; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(244, 245, 247, 0), var(--bg) 35%); }
  .replay span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .amb { animation: none; }
  .kw .c, .sub, .flow li { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="../"><i aria-hidden="true"></i>GTD 워크 <small>사용법</small></a>
    <ol class="chaps" id="chaps" aria-label="챕터"></ol>
  </header>

  <main class="main">
    <div class="stagebox" aria-hidden="true">
      <div class="amb"></div>
      <div class="phone"><div class="scr" id="scr"><iframe id="fa" title="앱 화면" tabindex="-1"></iframe><iframe id="fb" title="앱 화면" tabindex="-1"></iframe><i class="finger" id="finger"></i></div></div>
    </div>
    <section class="side" id="side" aria-live="polite"></section>
  </main>

  <footer class="bottom">
    <button class="nav prev" id="prev" type="button">← 이전</button>
    <button class="nav next" id="next" type="button">다음 →</button>
    <button class="replay" id="replay" type="button" aria-label="이 장면 다시 보기">↻ <span>다시 보기</span></button>
    <span class="count" id="count"></span>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var APP = '../app/', TALK = 'https://open.kakao.com/o/gmiCVeWi';
  var CH = ['시작', '담기', '보내기', '하루 쓰기', '돌아보기'];
  var NEXT = '세무사님께 부가세 자료 일정 전화로 확인', NEXT2 = '분기 보고서 초안 목차 쓰기';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 장면: 휴대폰 안은 실제 앱 화면(guide/s/*.html — GTD 레포 tools/guide-scenes.js로 생성). play = 그 위에서 재생할 동작.
  // kw = 크게 보일 한마디([ ]는 강조), sub = 한 줄 설명, flow = 순서가 있으면 큰 단어 칩
  var S = [
    { ch: -1, scene: 'home', eb: '사용법', kw: '머릿속은 [비우고], 오늘은 가볍게.', sub: '실제 앱 화면 위에서 하나씩 보여 드릴게요. <b>3분</b>이면 다 봐요.',
      play: function (a) { return a.wait(900).then(function () { return a.type('#capInput', '내일 회의 자료 뽑기'); }).then(function () { return a.wait(1400); }).then(function () { a.clear('#capInput'); }); } },
    { ch: 0, scene: 'home', eb: '시작', kw: '링크 하나로 [시작].', sub: '메일의 <b>시작하기</b>를 누르고 구글 계정을 고르면 끝. 내 드라이브에 내 시트가 생겨요.',
      flow: ['구글 계정 고르기', '고급 ▸ 이동', '모두 선택 ▸ 계속'],
      play: function (a) { return a.flowStep(0, 1200).then(function () { return a.flowStep(1, 1200); }).then(function () { return a.flowStep(2, 1200); }).then(function () { a.flowStep(-1, 0); return a.pulse('.hero'); }); } },
    { ch: 1, scene: 'home', eb: '담기', kw: '떠오르면, [한 줄].', sub: '맨 위 입력칸에 적고 <b>엔터</b>. 오늘 할 일에 바로 들어가요.',
      play: function (a) {
        return a.tap('#capInput').then(function () { return a.type('#capInput', '은행 서류 떼기'); })
          .then(function () { return a.tap('#capBtn'); }).then(function () { return a.show('capture-added'); })
          .then(function () { return a.pulse(a.row('은행 서류 떼기')); });
      } },
    { ch: 2, scene: 'home', eb: '보내기', kw: '누르면, [어디로?]', sub: '할 일을 누르면 보낼 곳이 한 번에 나와요. 날짜, 맡기기, 나중에.',
      play: function (a) {
        return a.tap(a.row(NEXT)).then(function () { return a.show('send', { sheet: true }); })
          .then(function () { return a.pulse('#sheetBody [data-a="s-day"] .tile, #sheetBody [data-a="s-who"] .tile, #sheetBody [data-a="s-later"] .tile'); });
      } },
    { ch: 2, scene: 'send', eb: '보내기', kw: '날짜는 [한 번에].', sub: '<b>날짜</b>를 누르면 오늘·내일·이번 주가 버튼으로 나와요.',
      play: function (a) {
        return a.tap('#sheetBody [data-a="s-day"]').then(function () { return a.show('send-day'); })
          .then(function () { return a.tap('#sheetBody [data-sday]:nth-child(2)'); });
      } },
    { ch: 2, scene: 'send', eb: '보내기', kw: '맡기고, [잊기].', sub: '누구에게 맡겼는지 적어 두면, 확인할 날에 다시 올라와요.',
      play: function (a) {
        return a.tap('#sheetBody [data-a="s-who"]').then(function () { return a.show('send-who'); })
          .then(function () { return a.tap('#sWhoIn'); }).then(function () { return a.type('#sWhoIn', '박주임'); }).then(function () { return a.tap('#sWhoOk'); });
      } },
    { ch: 3, scene: 'home', eb: '하루 쓰기', kw: '★ 오늘은 [이것만].', sub: '꼭 할 일에 ★. 맨 위로 올라와요. <b>3개</b>면 충분해요.',
      play: function (a) {
        return a.tap(a.row(NEXT2)).then(function () { return a.show('star-sheet', { sheet: true }); })
          .then(function () { return a.tap('#sheetBody [data-a="star"]'); }).then(function () { return a.show('star-done'); })
          .then(function () { return a.pulse(a.row(NEXT2)); });
      } },
    { ch: 3, scene: 'home', eb: '하루 쓰기', kw: '밀면, [끝].', sub: '끝낸 일은 오른쪽으로 한 번. 실수했으면 <b>되돌리기</b>.',
      play: function (a) { return a.swipe(a.row(NEXT)).then(function () { return a.show('swipe-done'); }).then(function () { return a.pulse('#toast button'); }); } },
    { ch: 3, scene: 'home', eb: '하루 쓰기', kw: '빈 시간에, [쏙].', sub: '<b>시간표</b>를 누르고 할 일을 끌어다 놓으면 구글 캘린더에 들어가요.',
      play: function (a) { return a.tap('[data-timeview]').then(function () { return a.show('timeline'); }).then(function () { return a.pulse('.dchip'); }); } },
    { ch: 3, scene: 'send', eb: '하루 쓰기', kw: '25분, [하나만].', sub: '<b>집중</b>을 누르면 타이머가 돌아요. 끝나면 완료.',
      play: function (a) { return a.tap('#sheetBody [data-a="focus"]').then(function () { return a.show('focus'); }).then(function () { return a.countdown('#fmClock', 24 * 60 + 59, 6); }); } },
    { ch: 3, scene: 'home', eb: '하루 쓰기', kw: '남은 일은 [내일로].', sub: '하루 끝에 <b>오늘 마무리</b>. 못 한 일은 골라서 내일로 넘겨요.',
      play: function (a) { return a.tap('[data-shutdown]').then(function () { return a.show('shutdown', { sheet: true }); }); } },
    { ch: 4, scene: 'home', eb: '돌아보기', kw: '맡긴 일, [며칠째?]', sub: '<b>맡긴 일 확인</b>에서 누가, 며칠째인지 한눈에. 문구를 복사해 카톡으로.',
      play: function (a) { return a.tap('[data-goto=waiting]').then(function () { return a.show('waiting'); }).then(function () { return a.pulse('[data-wid]'); }); } },
    { ch: 4, scene: 'weekly', eb: '돌아보기', kw: '금요일엔, [비우기].', sub: '<b>주간 검토</b>가 질문을 하나씩 물어요. 답하다 보면 머리가 가벼워져요.',
      play: function (a) { return a.pulse('#moreBody .card').then(function () { return a.tap('[data-wks=next]'); }); } },
    { ch: 5, scene: 'home', end: true, eb: '다 봤어요', kw: '이제 [직접] 해 봐요.', sub: '모르는 건 카톡방에 물어보세요. 바라는 기능도 들려주세요.', play: null }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var scr = $('scr'), fin = $('finger'), side = $('side'), chaps = $('chaps');
  var frames = [$('fa'), $('fb')], front = 0, cur = 0, token = 0;

  // ── 챕터 ──
  CH.forEach(function (c, i) {
    var li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.innerHTML = c + '<i><b></b></i>';
    b.addEventListener('click', function () { for (var j = 0; j < S.length; j++) if (S[j].ch === i) return go(j); });
    li.appendChild(b); chaps.appendChild(li);
  });
  function paintChaps() {
    var ch = S[cur].ch, end = !!S[cur].end;
    [].forEach.call(chaps.querySelectorAll('button'), function (b, i) {
      var idx = []; S.forEach(function (s, j) { if (s.ch === i) idx.push(j); });
      var done = idx.filter(function (j) { return j <= cur; }).length;
      b.className = i === ch ? 'on' : (end || ch > i ? 'done' : '');
      b.querySelector('b').style.width = (end ? 100 : Math.round(done / idx.length * 100)) + '%';
    });
  }

  // ── 휴대폰 크기 ──
  var k = 1;
  function fit() {
    k = scr.clientWidth / 390; frames.forEach(function (f) { f.style.transform = 'scale(' + k + ')'; });
    var fs = Math.round(Math.max(30, Math.min(46, 100 * k))); fin.style.width = fin.style.height = fs + 'px'; fin.style.margin = (-fs / 2) + 'px 0 0 ' + (-fs / 2) + 'px';
  }
  addEventListener('resize', fit);

  // ── 장면(두 iframe을 번갈아 띄움) ──
  var EXTRA = '.g-hl{animation:ghl 1.2s ease-out 1;position:relative;z-index:2}@keyframes ghl{0%{box-shadow:0 0 0 0 rgba(91,92,246,.65)}70%{box-shadow:0 0 0 14px rgba(91,92,246,0)}100%{box-shadow:0 0 0 0 rgba(91,92,246,0)}}' +
    '.g-press{transform:scale(.95)!important;transition:transform .12s!important}.g-focus{box-shadow:0 0 0 3px rgba(91,92,246,.35),0 10px 30px rgba(91,92,246,.2)!important}';
  function load(f, id) {
    return new Promise(function (res) {
      if (f.dataset.id === id && f.dataset.fresh === '1') return res();
      f.onload = function () {
        try {
          var d = f.contentDocument, st = d.createElement('style'); st.textContent = EXTRA; d.head.appendChild(st);
          [].forEach.call(d.querySelectorAll('[data-scroll]'), function (e) { e.scrollTop = +e.getAttribute('data-scroll'); });
        } catch (e) {}
        f.dataset.id = id; f.dataset.fresh = '1'; res();
      };
      f.src = 's/' + id + '.html?v=1';
    });
  }
  function doc() { return frames[front].contentDocument; }
  function show(id, opt) {
    var back = frames[1 - front];
    return load(back, id).then(function () {
      back.dataset.fresh = '0';
      var d = back.contentDocument, sh = d.getElementById('sheet'), dm = d.getElementById('dim');
      if (opt && opt.sheet && sh) { sh.classList.remove('on'); dm && dm.classList.remove('on'); } // 닫힌 채로 보여 주고 앱의 실제 애니메이션으로 연다
      frames[front].classList.remove('on'); back.classList.add('on'); front = 1 - front;
      if (opt && opt.sheet && sh) return wait(80).then(function () { sh.classList.add('on'); dm && dm.classList.add('on'); return wait(700); });
      return wait(400);
    });
  }

  // ── 동작 ──
  function wait(ms) { var t = token; return new Promise(function (res, rej) { setTimeout(function () { t === token ? res() : rej('stop'); }, reduce ? Math.min(ms, 60) : ms); }); }
  function el(sel) { return typeof sel === 'string' ? doc().querySelector(sel) : sel; }
  function row(text) {
    var hit = null;
    [].forEach.call(doc().querySelectorAll('.swr'), function (w) { var t = w.querySelector('.t'); if (!hit && t && t.textContent.replace(/★/g, '').trim() === text) hit = w.querySelector('.row'); });
    return hit;
  }
  function at(e) { var r = e.getBoundingClientRect(); return { x: (r.left + Math.min(r.width / 2, 120)) * k, y: (r.top + r.height / 2) * k }; }
  function moveTo(e) { var p = at(e); fin.classList.add('on'); fin.style.left = p.x + 'px'; fin.style.top = p.y + 'px'; return wait(720); }
  function tap(sel) {
    var e = el(sel); if (!e) return wait(200);
    return moveTo(e).then(function () { fin.classList.add('down', 'ping'); e.classList.add('g-press'); return wait(170); })
      .then(function () { fin.classList.remove('down'); e.classList.remove('g-press'); return wait(380); })
      .then(function () { fin.classList.remove('ping'); });
  }
  function pulse(sel) {
    var list = typeof sel === 'string' ? [].slice.call(doc().querySelectorAll(sel)) : [sel];
    fin.classList.remove('on');
    list.forEach(function (e) { if (e) { e.classList.remove('g-hl'); void e.offsetWidth; e.classList.add('g-hl'); } });
    return wait(1200);
  }
  function type(sel, text) {
    var e = el(sel); if (!e) return wait(100);
    var wrap = e.closest('.cap') || e; wrap.classList.add('g-focus'); fin.classList.remove('on');
    var i = 0;
    return (function next() { if (i > text.length) return wait(380); e.value = text.slice(0, i++); return wait(80 + Math.random() * 70).then(next); })()
      .then(function () { wrap.classList.remove('g-focus'); });
  }
  function clear(sel) { var e = el(sel); if (e) e.value = ''; }
  function swipe(e) {
    if (!e) return wait(100);
    var w = e.closest('.swr'), p0;
    return moveTo(e).then(function () {
      p0 = at(e); fin.classList.add('down', 'drag'); w.classList.add('goR'); e.classList.add('drag');
      var dx = 0;
      return (function step() {
        if (dx >= 250) return wait(150);
        dx += 14; e.style.transform = 'translateX(' + dx + 'px)'; fin.style.left = (p0.x + dx * k) + 'px';
        return wait(16).then(step);
      })();
    }).then(function () { fin.classList.remove('down', 'drag', 'on'); return wait(200); });
  }
  function countdown(sel, from, n) {
    var e = el(sel), s = from, i = 0; fin.classList.remove('on');
    return (function tick() {
      if (!e || i++ >= n) return wait(300);
      e.textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); s--;
      return wait(1000).then(tick);
    })();
  }
  function flowStep(i, ms) {
    [].forEach.call(side.querySelectorAll('.flow li'), function (li, j) { li.classList.toggle('now', j === i); });
    return ms ? wait(ms) : Promise.resolve();
  }
  var A = { wait: wait, tap: tap, pulse: pulse, type: type, clear: clear, swipe: swipe, show: show, row: row, countdown: countdown, flowStep: flowStep };

  // ── 글 ──
  // [ ]는 강조. 강조 묶음 안의 띄어쓰기와 바로 뒤 문장부호는 줄바꿈되지 않게 한 덩어리로
  function kwHtml(s) {
    var n = 0, words = [], w = [], em = false;
    for (var x = 0; x < s.length; x++) {
      var ch = s[x];
      if (ch === '[') { em = true; continue; }
      if (ch === ']') { em = false; continue; }
      if (ch === ' ' && !em) { if (w.length) words.push(w); w = []; continue; }
      w.push({ c: ch === ' ' ? '\u00a0' : ch, e: em });
    }
    if (w.length) words.push(w);
    return words.map(function (wd) {
      return '<span class="w">' + wd.map(function (o) { return '<span class="c' + (o.e ? ' e' : '') + '" style="--i:' + (n++) + '">' + o.c + '</span>'; }).join('') + '</span>';
    }).join(' ');
  }
  function paintSide(s) {
    var h = '<div class="eb">' + (s.ch >= 0 && !s.end ? '<b>' + (s.ch + 1) + '</b>' : '') + s.eb + '</div>' +
      '<h1 class="kw" aria-label="' + s.kw.replace(/[\[\]]/g, '') + '">' + kwHtml(s.kw) + '</h1><p class="sub">' + s.sub + '</p>';
    if (s.flow) h += '<ol class="flow">' + s.flow.map(function (f, i) { return '<li style="--i:' + i + '"><span>' + f + '</span></li>'; }).join('') + '</ol>';
    if (s.ch === -1) h += '<div class="links"><button class="btn pri" type="button" id="startBtn">시작하기 →</button></div>';
    if (s.end) h += '<div class="links"><a class="btn pri" href="' + APP + '">GTD 워크 열기</a><a class="btn talk" href="' + TALK + '" target="_blank" rel="noopener">💬 카톡방</a><button class="btn sub2" type="button" id="againBtn">처음부터 다시</button></div>';
    side.className = 'side'; side.innerHTML = h;
    var kw = side.querySelector('.kw');
    requestAnimationFrame(function () { requestAnimationFrame(function () { side.classList.add('on'); kw.classList.add('on'); }); });
    var sb = $('startBtn'); if (sb) sb.addEventListener('click', function () { go(1); });
    var ab = $('againBtn'); if (ab) ab.addEventListener('click', function () { go(0); });
  }

  // ── 재생: 처음 모습 → 동작 → 잠깐 쉬고 반복 ──
  function run() {
    var s = S[cur], my = ++token;
    fin.classList.remove('on', 'down', 'drag', 'ping');
    frames[1 - front].dataset.fresh = '0';
    return show(s.scene).then(function () {
      if (!s.play || my !== token) return;
      return wait(500).then(function () { return s.play(A); }).then(function () { fin.classList.remove('on'); return wait(2800); })
        .then(function () { if (my === token && !reduce) run(); });
    }).catch(function () {});
  }
  function go(i) {
    cur = Math.max(0, Math.min(S.length - 1, i));
    $('prev').disabled = cur === 0; $('next').disabled = cur === S.length - 1;
    $('count').textContent = (cur + 1) + ' / ' + S.length;
    paintSide(S[cur]); paintChaps(); run();
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }
  $('prev').addEventListener('click', function () { go(cur - 1); });
  $('next').addEventListener('click', function () { go(cur + 1); });
  $('replay').addEventListener('click', function () { run(); });
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  });
  // 휴대폰: 글 쪽을 옆으로 밀어 넘기기
  var sx = null;
  side.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  side.addEventListener('touchend', function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); sx = null; });

  addEventListener('hashchange', function () { var n = parseInt((location.hash || '').slice(1), 10); if (n > 0 && n - 1 !== cur) go(n - 1); });
  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(start > 0 ? start - 1 : 0);
})();
</script>
</body>
</html>
