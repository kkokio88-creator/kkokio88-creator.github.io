  .calbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .calbar .ttl { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; }
  .calbar .sp { flex: 1; }
  .calbar .nav { display: flex; gap: 6px; }
  .calbar .nav button { width: 42px; height: 42px; border-radius: 13px; background: var(--card); box-shadow: var(--sh); color: var(--t2); display: inline-flex; align-items: center; justify-content: center; }
  .sw { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--t2); cursor: pointer; }
  .sw input { display: none; }
  .sw i { width: 46px; height: 28px; border-radius: 14px; background: #D1D6DB; position: relative; transition: background .2s; }
  .sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); transition: left .3s var(--spring); }
  .sw input:checked + i { background: var(--g); }
  .sw input:checked + i::after { left: 21px; }
  .mg { display: grid; gap: 2px; background: var(--card); border-radius: 22px; padding: 12px 8px; box-shadow: var(--sh); }
  .mg .hd { text-align: center; font-size: 12.5px; color: var(--t3); font-weight: 600; padding: 4px 0 8px; }
  .mc { min-height: 58px; padding: 4px 2px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .mc .dn { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mc.out { opacity: .32; } .mc.we .dn { color: var(--red); }
  .mc.today .dn { background: var(--g); color: #fff; }
  .mc.sel:not(.today) .dn { background: var(--fill); }
  .wg { display: grid; gap: 8px; }
  .wcol { background: var(--card); border-radius: 18px; padding: 12px 10px; min-height: 240px; cursor: pointer; box-shadow: var(--sh); }
  .wcol.today { box-shadow: inset 0 0 0 2px var(--g), var(--sh); }
  .wcol .dh { font-size: 14.5px; font-weight: 700; color: var(--t3); margin-bottom: 8px; }
  .wcol.today .dh { color: var(--g); }
  .ev2 { font-size: 12.5px; font-weight: 600; padding: 6px 8px; border-radius: 9px; margin-bottom: 5px; background: var(--bluet); color: var(--blue); line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
  .ev2.t { background: var(--fill); color: var(--t2); }

  /* 집중 모드 */
  .fm { position: fixed; inset: 0; z-index: 60; background: radial-gradient(120% 90% at 50% 0%, #26265E 0%, #0C0C1E 70%); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .fm.on { display: flex; animation: pageIn .4s var(--ease); }
  .fm .lb { font-size: 14px; font-weight: 700; opacity: .55; letter-spacing: .02em; }
  .fm .ttl2 { font-size: 22px; font-weight: 700; max-width: 560px; line-height: 1.4; margin-top: 10px; }
  .fm .clock { font-size: 96px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 22px 0 36px; letter-spacing: -0.04em; }
  .fm .ctrl { display: flex; gap: 14px; }
  .fm .ctrl button { width: 78px; height: 78px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; font-size: 15px; font-weight: 700; }
  .fm .ctrl button.go { background: #fff; color: var(--g); }

  /* 탭바 */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.92); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-top: 1px solid rgba(0,0,0,.05); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: #B0B8C1; position: relative; }
  .tabbar button.on { color: var(--t1); }
  .chk::after { content: ''; position: absolute; inset: -10px; }
  .outbox { display: flex; align-items: center; gap: 6px; margin: 10px auto 0; padding: 10px 14px; min-height: 40px; border-radius: 12px; background: var(--ambert); color: #9A6700; font-size: 14px; font-weight: 700; }
  .dayadd { margin-top: 12px; }
  .plan .tray { background: var(--card); border-radius: 18px; padding: 12px 12px 8px; margin-bottom: 10px; box-shadow: var(--sh); }
  .trayh { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--t3); font-weight: 700; margin: 0 2px 8px; }
  .dchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .dchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 12px; background: var(--gt); color: var(--g); font-size: 14px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .dchip b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .dchip small { font-weight: 600; opacity: .7; flex: none; }
  .dchip.dragging, .blk.dragging { opacity: .35; }
  .dghost { position: fixed; z-index: 90; pointer-events: none; transform: translate(-50%, -60%) rotate(-2deg) scale(1.05); box-shadow: 0 14px 34px rgba(30, 30, 90, .28); background: var(--card); }
  .gridwrap { background: var(--card); border-radius: 18px; max-height: 560px; overflow: auto; box-shadow: var(--sh); overscroll-behavior: contain; }
  .dgrid { position: relative; margin: 10px 10px 10px 50px; }
  .dgrid .hr { position: absolute; left: -44px; right: 0; border-top: 1px solid var(--line); }
  .dgrid .hr span { position: absolute; left: 0; top: -9px; font-size: 11.5px; font-weight: 600; color: var(--t3); background: var(--card); padding-right: 6px; }
  .dgrid .nowl { position: absolute; left: -6px; right: 0; border-top: 2px solid var(--red); z-index: 3; }
  .dgrid .nowl::before { content: ''; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .blk { position: absolute; left: 4px; right: 4px; border-radius: 10px; padding: 4px 34px 4px 9px; overflow: hidden; line-height: 1.25; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
  .blk b { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk small { font-size: 11.5px; opacity: .8; }
  .blk.short { flex-direction: row; align-items: center; justify-content: flex-start; gap: 6px; }
  .blk.short small { flex: none; }
  .blk.ev { background: var(--bluet); color: var(--blue); padding-right: 9px; }
  .blk.pk { background: linear-gradient(135deg, #6D6BFF, #9C6BFF); color: #fff; touch-action: none; cursor: grab; box-shadow: 0 4px 14px rgba(91, 92, 246, .3); user-select: none; -webkit-user-select: none; }
  .blk .x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,.18); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .blk .x::after { content: ''; position: absolute; inset: -8px; }
  .drop { position: absolute; left: 4px; right: 4px; border-radius: 10px; border: 2px dashed var(--g); background: rgba(91, 92, 246, .1); color: var(--g); font-size: 12px; font-weight: 800; padding: 3px 8px; pointer-events: none; z-index: 4; }
  .ibcard .ib { padding: 16px 16px 4px; }
  .ibcard .tt { font-size: 19px; } .dayadd .field { margin: 0; }
  .tabbar .dot { position: absolute; top: 4px; left: 50%; margin-left: 7px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; }

  /* 토스트 */
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 14px) scale(.96); opacity: 0; z-index: 70; background: rgba(25,31,40,.95); color: #fff; padding: 14px 18px; border-radius: 16px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 16px; transition: transform .4s var(--spring), opacity .2s; pointer-events: none; white-space: nowrap; max-width: 92vw; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .toast.act { pointer-events: auto; }
  /* 개인 링크가 바뀌었을 때(시트에서 새로 만듦) — 사라지지 않는 안내 */
  .linknote { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); z-index: 96; max-width: 560px; margin: 0 auto; background: #FFFFFF; color: #191F28; border: 2px solid #F04452; border-radius: 18px; padding: 16px 18px; box-shadow: 0 12px 36px rgba(0,0,0,.22); font-size: 15px; line-height: 1.55; }
  .linknote b { display: block; color: #D22030; font-size: 16px; margin-bottom: 4px; }
  .linknote .path { display: inline-block; margin: 4px 0; padding: 2px 8px; border-radius: 8px; background: #F2F4F6; font-weight: 700; }
  .linknote .small { color: #4E5968; font-size: 14px; margin-top: 6px; }
  .linknote .small .em { display: inline; color: inherit; font-size: inherit; margin: 0; }
  .linknote .lnform { display: flex; gap: 8px; margin-top: 10px; }
  .linknote .lnform input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #E9ECEF; border-radius: 12px; background: #F2F4F6; color: #191F28; font-size: 15px; }
  .linknote .lnform button { padding: 10px 16px; border-radius: 12px; background: #5B5CF6; color: #fff; font-weight: 700; }
  .toast .undo { color: #B9B9FF; font-weight: 700; font-size: 15px; }
  .syncing::after { content: ' · 맞추는 중'; color: var(--t4); }

  /* 온보딩 */
  .onb { position: fixed; inset: 0; z-index: 95; background: var(--bg); display: none; flex-direction: column; padding: 28px 24px calc(28px + env(safe-area-inset-bottom)); }
  .onb.on { display: flex; }
  .onb .slides { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
  .onb .slide { display: none; max-width: 360px; }
  .onb .slide.on { display: block; animation: pageIn .45s var(--ease); }
  .onb .tile { width: 96px; height: 96px; border-radius: 30px; margin-bottom: 28px; }
  .onb h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.35; }
  .onb p { font-size: 17px; color: var(--t3); margin-top: 12px; font-weight: 500; line-height: 1.5; }
  .onb .pg { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .onb .pg i { width: 7px; height: 7px; border-radius: 4px; background: #D1D6DB; transition: width .3s var(--ease), background .3s; }
  .onb .pg i.on { width: 22px; background: var(--g); }

  /* 모션 공통 */
  button, .row, .wd, .mc, .wcol, .apill, .chip, .big, .qa { transition: transform .16s var(--ease), background .15s, box-shadow .2s, opacity .25s var(--ease); }
  button:active, .apill:active, .chip:active, .big:active, .qa:active { transform: scale(.95); }
  .row:active, .wd:active, .mc:active, .wcol:active { transform: scale(.985); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .anim .row, .anim .wd, .anim .mc, .anim .act, .anim .chip, .anim .big, .anim .qa, .anim .apill { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
  .fly { position: fixed; z-index: 80; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--g); box-shadow: 0 2px 10px rgba(91,92,246,.45); pointer-events: none; left: 0; top: 0; }
  .bump { animation: bump .45s var(--spring); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
  .drawok { width: 92px; height: 92px; margin: 0 auto 14px; display: block; }
  .drawok circle, .drawok path { fill: none; stroke: var(--g); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .drawok circle { stroke-dasharray: 283; stroke-dashoffset: 283; animation: draw .7s var(--ease) forwards; opacity: .22; }
  .drawok path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .45s var(--ease) .55s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  ::view-transition-group(task-title) { animation-duration: .4s; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  .story .pin { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 18px; text-align: center; }
  .story .pin .n { font-size: 88px; font-weight: 800; color: var(--g); line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  .story .pin .l { font-size: 18px; font-weight: 700; margin-top: 8px; }
  .story .pin .bar { height: 6px; border-radius: 3px; background: #E5E8EB; margin: 16px auto 0; max-width: 240px; overflow: hidden; }
  .story .pin .bar i { display: block; height: 100%; width: 0; background: var(--g); transition: width .45s var(--ease); }
  .story .beat { min-height: 32vh; display: flex; align-items: center; }
  .story .beat .row { width: 100%; border-radius: 20px; box-shadow: var(--sh); opacity: 0; transform: translateY(40px) scale(.96); transition: opacity .5s var(--ease), transform .6s var(--spring); }
  .story .beat.in .row { opacity: 1; transform: none; }
  .story .end { min-height: 28vh; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; opacity: 0; transition: opacity .6s var(--ease); }
  .story .end.in { opacity: 1; }
  #confetti { position: fixed; inset: 0; z-index: 90; pointer-events: none; }

  .pcOnly { display: none; }
  @media (min-width: 1024px) {
    .shell { display: grid; grid-template-columns: 248px 1fr; }
    .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 30px 16px; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; padding: 0 12px 26px; display: flex; align-items: center; gap: 10px; }
    .brand .tile { width: 32px; height: 32px; border-radius: 10px; background: var(--g); color: #fff; }
    .nv { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; font-size: 16px; font-weight: 600; color: var(--t2); text-align: left; }
    .nv:hover { background: #EAECEF; }
    .nv.on { background: var(--card); color: var(--t1); box-shadow: var(--sh); }
    .nv.on svg { color: var(--g); }
    .nv .sp { flex: 1; }
    .side .grow { flex: 1; }
    .side .sheetlink { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--t3); padding: 10px 14px; font-weight: 600; text-decoration: none; }
    .main { max-width: 1120px; padding: 44px 48px 64px; margin: 0; }
    .main.narrow { max-width: 720px; }
    .tabbar { display: none; }
    .toast { bottom: 40px; }
    .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 460px; border-radius: 26px; transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: transform .35s var(--spring), opacity .2s; }
    .sheet.on { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
    .sheet .grab { display: none; }
    .todayGrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; align-items: start; }
    .todayGrid .colB { position: sticky; top: 44px; }
    .todayGrid .colB .h2:first-child { margin-top: 6px; }
    .pcOnly { display: block; } .mOnly { display: none !important; }
    .alerts { margin: 12px 0 0; padding: 2px 0 4px; }
  }
  @media (max-width: 1023px) { .wg { grid-auto-flow: column; grid-auto-columns: 46%; overflow-x: auto; } }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1113; --card: #1A1D21; --t1: #ECEFF1; --t2: #B4BCC5; --t3: #8A949E; --t4: #5F6872; --line: #2A2E33; --fill: #24282D;
      --gt: #23234A; --ambert: #33280E; --bluet: #12233D; --purplet: #241F3D; --redt: #3A1A1E; --sh: none; --g2: #7B7CFF; }
    .cap { background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(120deg, #6D6BFF, #E05FAE, #4FB8D8) border-box; }
    .card, .wk, .mg, .wcol, .ib, .apill, .pillbtn, .calbar .nav button { box-shadow: none; }
    .tabbar { background: rgba(26, 29, 33, .92); border-top-color: rgba(255,255,255,.06); }
    .ring .bg { stroke: #2A2E33; } .chk { border-color: #4A5159; } .seg { background: #24282D; } .seg .ind { background: #3A4048; }
    .sw i { background: #3A4048; } .story .pin { background: var(--bg); } .big .tile { background: var(--card); } .toast { background: #2B3036; }
    .h1 em, .ring .pc, .chip.on { color: #A2A3FF; } .chip.on { box-shadow: inset 0 0 0 1.5px #A2A3FF; } .chk.on { background: #6C6DFF; border-color: #6C6DFF; } .big.pri { background: #6C6DFF; } .wd.today .dn, .mc.today .dn { background: #6C6DFF; } .tile.green { color: #A2A3FF; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="tile"><svg class="i" data-i="check" width="18" height="18"></svg></span>내 업무</div>
    <button class="nv on" data-go="today"><svg class="i" data-i="home" width="20" height="20"></svg>오늘<span class="sp"></span><span class="cnt" id="sNow" style="display:none"></span></button>
    <button class="nv" data-go="inbox"><svg class="i" data-i="inbox" width="20" height="20"></svg>수집함<span class="sp"></span><span class="cnt" id="sInbox" style="display:none;background:var(--amber);color:#fff"></span></button>
    <button class="nv" data-go="calendar"><svg class="i" data-i="calendar" width="20" height="20"></svg>캘린더</button>
    <button class="nv" data-go="more"><svg class="i" data-i="grid" width="20" height="20"></svg>더보기</button>
    <div class="grow"></div>
    <a class="sheetlink" id="sheetLink" href="#" target="_blank"><svg class="i" data-i="file" width="18" height="18"></svg>구글 시트 열기</a>
  </aside>

  <main class="main" id="main">
    <section class="page on" id="p-today">
      <div class="todayGrid">
        <div class="colA">
          <div class="hero">
            <div><div class="eyebrow" id="date">&nbsp;</div><div class="h1" id="hero">&nbsp;</div><div class="sub2" id="heroSub">&nbsp;</div></div>
            <div class="ring" id="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="32"/><circle class="fg" id="ringFg" cx="38" cy="38" r="32" stroke-dasharray="201" stroke-dashoffset="201"/></svg><span class="pc" id="ringPc">0%</span></div>
          </div>
          <div class="capwrap"><form class="cap" id="capForm" autocomplete="off">
            <span class="spark"><svg class="i" data-i="sparkle" width="20" height="20"></svg></span>
            <input id="capInput" placeholder="떠오르는 일을 적어 보세요" enterkeyhint="done">
            <button type="submit" aria-label="담기" id="capBtn"><span class="mp"><svg class="i" data-i="plus" width="22" height="22"></svg></span><span class="mc2"><svg class="i" data-i="check" width="22" height="22"></svg></span></button>
          </form></div>
          <div id="todayA"></div>
        </div>
        <div class="colB" id="todayB"></div>
      </div>
    </section>

    <section class="page" id="p-inbox"><div id="inboxBody"></div></section>

    <section class="page" id="p-calendar">
      <div class="calbar"><span class="ttl" id="cTitle"></span><span class="sp"></span><span class="nav"><button id="cPrev" aria-label="이전"><svg class="i" data-i="chevL" width="20" height="20"></svg></button><button id="cNext" aria-label="다음"><svg class="i" data-i="chev" width="20" height="20"></svg></button></span></div>
      <div class="calbar">
        <div class="seg" id="cMode"><button data-m="day">일</button><button data-m="week">주</button><button data-m="month">월</button></div>
        <span class="sp"></span><label class="sw"><input type="checkbox" id="cWeekend" checked><i></i>주말</label>
      </div>
      <div id="cBody"></div>
      <div id="cDay"></div>
    </section>

    <section class="page" id="p-more"><div id="moreBody"></div></section>
  </main>
</div>

<nav class="tabbar">
  <button data-go="today" class="on"><svg class="i" data-i="home" width="24" height="24"></svg>오늘</button>
  <button data-go="inbox"><svg class="i" data-i="inbox" width="24" height="24"></svg>수집함<span class="dot" id="tInbox"></span></button>
  <button data-go="calendar"><svg class="i" data-i="calendar" width="24" height="24"></svg>캘린더</button>
  <button data-go="more"><svg class="i" data-i="grid" width="24" height="24"></svg>더보기</button>
</nav>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetBody"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="fm" id="fm">
  <div class="lb">집중 중</div>
  <div class="ttl2" id="fmTitle"></div>
  <div class="clock" id="fmClock">25:00</div>
  <div class="ctrl"><button id="fmPause">멈춤</button><button class="go" id="fmDone">완료</button><button id="fmClose">닫기</button></div>
</div>

    var url = data && data.pageUrl; if (!url || !window.fetch) return;
    var c = null; try { c = JSON.parse(localStorage.getItem('kitLatest') || 'null'); } catch (e) {}
    var mine = data.kitVersion || KIT.version;
    var use = function (j) { if (j && j.version && verGt(j.version, mine)) newVer = j.version; };
    if (c && Date.now() - c.at < 864e5) return use(c.j);
    fetch(url + 'latest.json', { cache: 'no-store', credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (j) { try { localStorage.setItem('kitLatest', JSON.stringify({ at: Date.now(), j: j })); } catch (e) {} use(j); }).catch(function () {});
  }
  if (!window.KIT_ENGINE) setTimeout(checkUpdate, 3000); // v2 앱은 열 때마다 최신이라 업데이트 안내가 필요 없다

  // v2: 엔진이 뒤에서 새로 받은 시트·캘린더가 달라졌다고 알리면 보고 있는 화면만 다시 그린다 (열린 창·끄는 중이면 잠시 뒤)
  window.addEventListener('kit:changed', function onKitChanged() {
    if ($('sheet').classList.contains('on') || document.querySelector('.dragging')) { setTimeout(onKitChanged, 2000); return; }
    if ($('p-today').classList.contains('on')) load();
    else if ($('p-calendar').classList.contains('on')) { calCache = {}; loadCal(); }
  });
  if (INITIAL) { data = INITIAL; saveView(INITIAL); renderToday(); }
  else { var cv0 = cachedView(); if (cv0) { data = cv0; renderToday(); } load(); }
  renderOutbox(); setTimeout(flushOutbox, 1500);
  // 안드로이드 '공유하기'로 들어온 내용 → 입력칸에 채우기 (공용 페이지의 share_target)
  (function () {
    try {
      var q = new URLSearchParams(location.search), parts = [q.get('share_title'), q.get('share_text'), q.get('share_url')].filter(Boolean);
      if (!parts.length) return;
      var text = parts.filter(function (p, i) { return parts.indexOf(p) === i; }).join(' ').replace(/\s+/g, ' ').trim().slice(0, 300);
      history.replaceState(null, '', location.pathname + location.hash);
      go('today'); $('capInput').value = text; setTimeout(function () { $('capInput').focus(); }, 300);
      toast('공유한 내용이에요. ＋를 누르면 담겨요');
    } catch (e) {}
  })();
</script>
