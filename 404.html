<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 — 내 업무관리 키트</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #05050A; color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; }
  .n { font-size: clamp(80px, 18vw, 180px); font-weight: 800; letter-spacing: -0.05em; line-height: 1; background: linear-gradient(135deg, #6D6BFF, #FF7AC6 60%, #5FD3F3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { margin: 16px 0 8px; font-size: clamp(24px, 4vw, 36px); font-weight: 800; }
  p { margin: 0 0 32px; color: rgba(255, 255, 255, .66); font-size: 17px; }
  a { display: inline-block; padding: 15px 24px; border-radius: 16px; background: #5B5CF6; color: #fff; font-weight: 800; text-decoration: none; }
  a:focus-visible { outline: 3px solid #8B8CFF; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="n" aria-hidden="true">404</div>
  <h1>이 페이지는 없어요.</h1>
  <p>주소가 바뀌었거나 잘못 들어왔어요.</p>
  <a href="/">내 업무관리 키트 홈으로</a>
</main>
</body>
</html>
